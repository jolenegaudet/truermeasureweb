# Truer Measure website.
#
# SERVER-SIDE ENVIRONMENT VARIABLES
# Set these in the Netlify UI, never in this file and never in the repository:
#   Site configuration > Environment variables
#
#   KIT_API_KEY   required.  The Kit V4 API key. Read only by
#                            netlify/functions/kit-subscribe.ts, which runs on
#                            the server. It is never sent to the browser: the
#                            site is a static export and nothing in it is built
#                            from this value. Scope it to Functions.
#                            Create the key in Kit under Settings > Developer >
#                            V4 Keys. Kit shows it once.
#
#   KIT_TAG_ID    optional.  Numeric id of the "Truer Measure - First to Know"
#                            tag. Saves one lookup per cold start. The function
#                            finds the tag by name, and creates it, without this.
#
#   GHL_API_TOKEN       required for netlify/functions/contact-submit.ts, the
#   GHL_LOCATION_ID     older waitlist and withdrawal form.
#
# Environment variable names cannot contain spaces. The name you give a key
# inside Kit ("Truer Measure Website") is Kit's own label for it and is not the
# variable name here.

[build]
  command   = "npm run build"
  publish   = "out"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── THE LAUNCH IS ON, 9 November 2026 ───────────────────────────────────────
#
# Her instruction: "Then merge and publish the website, with the currency key
# matching the app's." These two variables are what turn the prices on and point
# the buttons at the app instead of the demo. Without them SHOW_PRICES is false,
# content/app-plans.ts forces the app host to empty, and every button opens the
# demo and says so.
#
# WHY THEY ARE HERE AND NOT IN THE NETLIFY UI. They belong in the UI and she can
# move them there whenever she likes; this file does the same job and it is the
# only one of the two I can reach. The Netlify MCP rejected every documented
# shape for setting a variable, there is no Netlify CLI on this machine, and
# widening a token's scope for a one-off is against her own rule. Neither value
# is a secret: both are compiled into the public pages anyway, which is what
# NEXT_PUBLIC_ means. The one real secret, TM_CURRENCY_KEY, stays in the Netlify
# UI and is not in this file and never will be.
#
# PRODUCTION ONLY, deliberately. A branch deploy or a deploy preview keeps the
# maintenance build, so a preview link can never show prices or send anyone to
# live payments. That is most of what the old gate was for.
#
# TO PUT THE SITE BACK: delete this block and redeploy. One commit.
[context.production.environment]
  # Her amounts of 29 October 2026: CA$47, US$47, EUR 47 a month.
  NEXT_PUBLIC_TM_PRICES_APPROVED = "1"
  # The production app, confirmed answering 200 on 9 November 2026, with
  # /api/legal naming /terms-of-service, /privacy and /licence, all of which
  # answer 200 since the documents were published the same day.
  NEXT_PUBLIC_TM_APP_URL = "https://app.truermeasure.com"

# The visitor's country, resolved by Netlify and turned into one attribute on
# the page (netlify/edge-functions/currency.ts). The function also declares
# this path itself; both are here so the routing is visible in the config a
# person reads first. Inline config wins if they ever disagree.
[[edge_functions]]
  function = "currency"
  path     = "/*"

# THE PRODUCT PAGE MOVED, 9 November 2026. Her instruction: "Change the URL for
# /the-truer-measure."
#
# The page was /hidden-report-card in both languages from the day the site went
# up until the product was renamed. These two redirects are the whole reason the
# rename was safe to do: every link she has ever posted, every email already
# sent and every search result in the index points at the old pair.
#
# 301 AND NOT 302, deliberately. A permanent redirect is what moves a page's
# accumulated ranking to the new address; a temporary one tells a search engine
# to keep indexing the old one, which would leave the dead name in results for
# months. There is no reason to go back, so there is no reason to say it might.
#
# DO NOT REMOVE THESE. They cost nothing and they are load-bearing for the
# oldest inbound links the site has. The French one is listed first only because
# Netlify matches rules in order and the English rule would otherwise swallow it
# if either is ever loosened to a wildcard.
[[redirects]]
  from   = "/fr/hidden-report-card"
  to     = "/fr/the-truer-measure"
  status = 301

[[redirects]]
  from   = "/hidden-report-card"
  to     = "/the-truer-measure"
  status = 301

# /terms, because the customer app's agreement screen links to it.
#
# Confirmed with the app session on 2 November 2026: the app's agreement screen
# (js/account.js:370) links https://truermeasure.com/terms and
# https://truermeasure.com/privacy, and both return 404 on the live site today.
# The Terms exist, at /terms-of-service, so this is a one-line fix and it costs
# nothing: anyone who types /terms today also gets the 404 page.
#
# /privacy needs no redirect: since 9 November 2026 it IS the product Privacy
# Policy, published on her instruction from offer/legal-documents-current. This
# paragraph said it was held back pending counsel; that stopped being true when
# she published the three documents.
#
# This is no longer what the app depends on, and it stays anyway. From app
# commit 19903d2 (3 November 2026) the app's Terms and Privacy links and its
# consent version are release settings, and its release check refuses a release
# where either link does not answer 200. At release it points straight at
# /terms-of-service. This redirect is then for anyone who types /terms, where
# the 404 is just as real.
[[redirects]]
  from   = "/terms"
  to     = "/terms-of-service"
  status = 301

# /license, the American spelling, to /licence, the Canadian one.
#
# Her validation, 5 November 2026: "Je valide /licence, /contrat-de-licence et
# la redirection de /license vers /licence." This repository uses "licence"
# everywhere, 13 times against zero, and the Terms call the document the
# End-User Licence Agreement in English and the Contrat de licence in French.
# But /license is what a large share of readers will type, and a 404 on a
# document somebody has agreed to is the worst 404 on this site.
#
# IT NOW POINTS AT A REAL PAGE. /licence is the End-User Licence Agreement,
# published 9 November 2026 from offer/legal-documents-current. The redirect was
# written while it was still a 404 so that it could not be forgotten in the
# change that published the document; that change has happened.
#
# /contrat-de-licence is NOT routed: the Licence is English only until the
# French translation exists, the same as the Terms. See content/i18n.ts.
[[redirects]]
  from   = "/license"
  to     = "/licence"
  status = 301

[[redirects]]
  from   = "/build"
  to     = "/inner-circle"
  status = 301

[[redirects]]
  from   = "/build/*"
  to     = "/inner-circle/:splat"
  status = 301

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
