# Truer Measure website.
#
# SERVER-SIDE ENVIRONMENT VARIABLES
# Set these in the Netlify UI, never in this file and never in the repository:
#   Site configuration > Environment variables
#
#   KIT_API_KEY   required.  The Kit V4 API key. Read only by
#                            netlify/functions/kit-subscribe.ts, which runs on
#                            the server. It is never sent to the browser: the
#                            site is a static export and nothing in it is built
#                            from this value. Scope it to Functions.
#                            Create the key in Kit under Settings > Developer >
#                            V4 Keys. Kit shows it once.
#
#   KIT_TAG_ID    optional.  Numeric id of the "Truer Measure - First to Know"
#                            tag. Saves one lookup per cold start. The function
#                            finds the tag by name, and creates it, without this.
#
#   GHL_API_TOKEN       required for netlify/functions/contact-submit.ts, the
#   GHL_LOCATION_ID     older waitlist and withdrawal form.
#
# Environment variable names cannot contain spaces. The name you give a key
# inside Kit ("Truer Measure Website") is Kit's own label for it and is not the
# variable name here.

[build]
  command   = "npm run build"
  publish   = "out"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The visitor's country, resolved by Netlify and turned into one attribute on
# the page (netlify/edge-functions/currency.ts). The function also declares
# this path itself; both are here so the routing is visible in the config a
# person reads first. Inline config wins if they ever disagree.
[[edge_functions]]
  function = "currency"
  path     = "/*"

# /terms, because the customer app's agreement screen links to it.
#
# Confirmed with the app session on 2 November 2026: the app's agreement screen
# (js/account.js:370) links https://truermeasure.com/terms and
# https://truermeasure.com/privacy, and both return 404 on the live site today.
# The Terms exist, at /terms-of-service, so this is a one-line fix and it costs
# nothing: anyone who types /terms today also gets the 404 page.
#
# /privacy is deliberately NOT here. The Privacy Policy is written, translated
# and routed but held in app/_pending while counsel reviews it
# (PRIVACY_POLICY_PUBLISHED in content/first-to-know.ts), and a redirect to a
# page that does not exist is a second 404 with a longer path. It goes in with
# the policy, in the same change, not before it.
#
# This does not fix the app's side. The app records consent against
# terms-1.2+privacy-draft-2026-10-13 and will need a new consent version
# pointing at the published documents, which is counsel's gate, not a redirect.
[[redirects]]
  from   = "/terms"
  to     = "/terms-of-service"
  status = 301

[[redirects]]
  from   = "/build"
  to     = "/inner-circle"
  status = 301

[[redirects]]
  from   = "/build/*"
  to     = "/inner-circle/:splat"
  status = 301

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
